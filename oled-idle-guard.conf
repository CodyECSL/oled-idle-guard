# /etc/oled-idle-guard.conf  --  read by the oled-idle-guard systemd service.
# Edit values, then:  sudo systemctl restart oled-idle-guard
#
# These are the BASE values. The tray indicator can change the four timing
# values below at runtime (Timeouts panel in the activity monitor); those live
# changes are saved to /var/lib/oled-idle-guard/overrides.json and take
# precedence until you press "Reset to config file" there (or delete that file).

# Desktop user whose session gets dimmed / locked / blanked.
# install.sh fills these in automatically for the active desktop session;
# only edit them by hand if the primary desktop user changes.
GUARD_UID=1000
GUARD_USER=CHANGEME

# Seconds with NO keyboard / mouse / gamepad input before each action.
DIM_TIMEOUT=120          # lower brightness on all outputs
LOCK_TIMEOUT=300         # lock the session AND power the panels off (DPMS)

# While already locked: if the screen gets woken (e.g. a gamepad button) but
# then sees no input again for this long, blank it once more. Protects the
# lock screen itself from burning into an OLED.
RELOCK_BLANK_SEC=60

# Brightness percentage applied when dimming (1-100).
DIM_BRIGHTNESS=15

# Gamepad analog sticks drift. Movement smaller than this fraction of an
# axis's full range is ignored so a drifting stick can't keep the screen awake.
ABS_THRESHOLD_FRAC=0.10

# Internals -- rarely need changing.
TICK_SEC=1.0
DEVICE_RESCAN_SEC=4.0
DEBUG=0                  # set to 1 to log every input event to the journal
